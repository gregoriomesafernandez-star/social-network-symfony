security:
    # ===== HASH DE CONTRASEÑAS =====
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # ===== PROVEEDOR DE USUARIOS =====
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ===== FIREWALLS =====
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets/|build/)
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Formulario de Login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: /      # Después de login exitoso

            # Logout
            logout:
                path: app_logout
                target: app_login

    # ===== CONTROL DE ACCESO =====
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }



when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10


        